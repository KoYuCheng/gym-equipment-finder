const IconCamera = (p) => <Icon {...p} d={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>} />;

const SCAN_ERR = {
  not_granted: "你未授權使用 Claude 辨識，請重新整理後再試並按「允許」。",
  rate_limited: "操作太頻繁，請稍候再試。",
  images_unavailable: "目前環境不支援圖片辨識，請改用下方名稱搜尋。",
  image_rejected: "這張圖片無法讀取，請改用 JPG/PNG/WebP 並小於 20MB。",
  invalid_json: "辨識結果格式異常，請重拍一次或換個角度。",
};
const readDataUrl = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

function ScanPanel({ onClose }) {
  const [sample, setSample] = useState(undefined);
  const [canImg, setCanImg] = useState(false);
  const [accept, setAccept] = useState("image/jpeg,image/png,image/webp");
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);
  const [err, setErr] = useState("");
  const [q, setQ] = useState("");
  const ctl = useRef(null);

  React.useEffect(() => {
    let dead = false;
    (async () => {
      try {
        const sm = window.claude ? await window.claude.use("sample") : null;
        if (dead) return;
        setSample(sm || null);
        if (sm) {
          const l = await sm.limits().catch(() => null);
          if (!dead && l && l.images) { setCanImg(true); setAccept(l.images.mediaTypes.join(",")); }
        }
      } catch (e) { if (!dead) setSample(null); }
    })();
    return () => { dead = true; };
  }, []);

  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f || !sample) return;
    setRes(null); setErr(""); setBusy(true);
    try { setPreview(await readDataUrl(f)); } catch (x) {}
    ctl.current = new AbortController();
    const catalog = ALL.map((x, i) => `${i}|${x.en}|${x.zh}`).join("\n");
    const prompt = `你是健身器材辨識助手。圖片是健身房裡的一台器械（可能包含銘牌、標示、握把、座椅與配重片結構）。請對照下列清單，找出最可能的器械，最多 3 個，由最可能到最不可能。清單格式為 id|英文名|中文名：\n${catalog}\n\n只回傳 JSON，格式：{"is_gym_equipment":true,"guess":"你認為的器械中文名與英文名（即使不在清單內）","matches":[{"id":0,"confidence":"high|medium|low","reason":"繁體中文一句話，說明從圖片哪些特徵判斷"}]}。若圖片不是健身器械或無法判斷，is_gym_equipment 設為 false，matches 為空陣列。`;
    try {
      setRes(await sample.json(prompt, { images: f, signal: ctl.current.signal }));
    } catch (x) {
      if (x.code !== "cancelled") setErr(SCAN_ERR[x.code] || "辨識失敗，請換個角度重拍，或改用下方名稱搜尋。");
    } finally { setBusy(false); }
  };

  const matches = res ? (res.matches || []).filter(m => ALL[m.id]).slice(0, 3) : [];
  const found = q.trim() ? ALL.filter(x => (x.zh + x.en + x.sub + x.mz).toLowerCase().includes(q.trim().toLowerCase())).slice(0, 6) : [];
  const CONF = { high: "高度相符", medium: "可能相符", low: "低度相符" };

  return (
    <section className="fadein max-w-7xl mx-auto px-4 sm:px-8 mt-6">
      <div className="bg-slate-800/70 border border-cyan-400/40 rounded-2xl p-4 sm:p-6">
        <div className="flex items-start justify-between gap-3">
          <div>
            <h2 className="text-xl font-extrabold flex items-center gap-2"><IconCamera className="text-cyan-400" />拍照辨識器械</h2>
            <p className="text-sm text-slate-400 mt-1">在健身房看到不認識的器械？拍張照，系統會比對資料庫並顯示器械資訊、使用要點與教學影片。</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-100 text-sm shrink-0">收合 ✕</button>
        </div>

        <div className="grid md:grid-cols-3 gap-5 mt-4">
          <div>
            {sample === undefined && <p className="text-sm text-slate-400">準備辨識功能中…</p>}
            {sample === null && <p className="text-sm text-amber-300">拍照辨識需要在 Claude 內開啟此頁面才能使用；你仍可用下方名稱搜尋。</p>}
            {sample && !canImg && <p className="text-sm text-amber-300">目前環境不支援圖片辨識，請改用下方名稱搜尋。</p>}
            {sample && canImg && (
              <label className={"flex items-center justify-center gap-2 rounded-xl py-3 font-semibold cursor-pointer transition-colors " + (busy ? "bg-slate-700 text-slate-400" : "bg-cyan-400 text-slate-900 hover:bg-cyan-300")}>
                <IconCamera size={18} />{busy ? "辨識中…" : "拍照 / 選擇照片"}
                <input type="file" accept={accept} capture="environment" className="hidden" disabled={busy} onChange={onFile} />
              </label>
            )}
            {busy && <button onClick={() => ctl.current && ctl.current.abort()} className="mt-2 text-xs text-slate-400 underline">停止</button>}
            {preview && <img src={preview} alt="你上傳的器械照片" className="mt-3 w-full max-h-64 object-contain rounded-xl border border-slate-700 bg-slate-900" />}
            <p className="text-xs text-slate-500 mt-2">提示：拍到整台器械與銘牌效果最好。照片會交由 Claude 辨識，並使用你自己的 Claude 額度。</p>
          </div>

          <div className="md:col-span-2 space-y-4">
            {busy && <p className="text-cyan-300 animate-pulse">正在比對 {ALL.length} 台器械資料…</p>}
            {err && <p className="text-rose-300 text-sm">{err}</p>}
            {res && matches.length === 0 && (
              <div className="p-4 rounded-xl border border-dashed border-slate-600 text-sm text-slate-300">
                {res.is_gym_equipment === false ? "這張照片看起來不是健身器械，請重拍。" : "資料庫中找不到相符的器械。"}
                {res.guess && res.is_gym_equipment !== false && <div className="mt-2">可能是：<span className="text-cyan-300">{res.guess}</span>
                  <a className="ml-2 text-emerald-400 underline" target="_blank" rel="noopener noreferrer" href={yt(res.guess + " 教學")}>YouTube 搜尋</a></div>}
              </div>
            )}
            {matches.length > 0 && (
              <div className="grid sm:grid-cols-2 gap-4">
                {matches.map((m, i) => (
                  <div key={m.id} className="space-y-2">
                    <div className="text-xs rounded-lg bg-slate-900 border border-slate-700 px-3 py-2">
                      <span className={"font-bold " + (m.confidence === "high" ? "text-emerald-400" : "text-amber-300")}>#{i + 1} {CONF[m.confidence] || "可能相符"}</span>
                      <span className="text-slate-400"> · {m.reason}</span>
                    </div>
                    <MachineCard m={ALL[m.id]} />
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="mt-5 pt-4 border-t border-slate-700">
          <label className="text-xs text-slate-400">已知名稱？直接搜尋（中文或英文，例如「蝴蝶機」、「leg press」）</label>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="輸入器械名稱或肌群…"
            className="w-full mt-1 bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400" />
          {q.trim() && found.length === 0 && <p className="text-sm text-slate-400 mt-3">找不到符合的器械。</p>}
          {found.length > 0 && <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">{found.map(m => <MachineCard key={m.en} m={m} />)}</div>}
        </div>
      </div>
    </section>
  );
}

            </h2>
            <p className="text-slate-300 mt-2 text-sm sm:text-base"><span className="text-emerald-400 font-semibold">訓練目標：</span>{active ? MUSCLES[active].goal : G.desc}</p>
            <p className="text-xs text-slate-500 mt-2">共 {list.length} 款器械 · 影片按鈕為 YouTube 關鍵字搜尋，請挑選最新、評價高的影片。</p>
          </div>
          {list.length === 0 ? (
            <div className="text-center p-10 border border-dashed border-slate-600 rounded-2xl text-slate-400">
              此肌群在「{G.label}」目標下沒有推薦器械。
              <div><button onClick={() => chooseGoal("all")} className="mt-3 text-emerald-400 underline">改看全部器械</button></div>
            </div>
          ) : (
            <div key={goal + active} className="grid sm:grid-cols-2 gap-4">
              {list.map(m => <MachineCard key={m.en} m={m} />)}
            </div>
          )}
          <p className="text-xs text-slate-500 mt-6">⚠ 本工具僅供教育參考，不能取代專業教練或醫療建議；若有疼痛或舊傷，請先諮詢專業人員。</p>
        </section>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
