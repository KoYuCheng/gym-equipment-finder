const beep = () => {
  const c = audio();
  if (c) [0, 0.3, 0.6].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.2, c.currentTime + t); o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.18); });
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
};

function LogBox({ m, logs, onSave }) {
  const hist = logs[m.en] || [];
  const last = hist[hist.length - 1];
  const [w, setW] = useState(last ? String(last.w) : "");
  const [r, setR] = useState(last ? String(last.r) : "");
  const [rpe, setRpe] = useState(last ? String(last.rpe) : "");
  const [msg, setMsg] = useState("");
  const save = () => {
    const W = parseFloat(w), R = parseInt(r, 10), P = parseFloat(rpe);
    if (!(W >= 0) || !(R > 0) || !(P >= 1 && P <= 10)) { setMsg("請輸入有效的重量、次數與 RPE（1–10）"); return; }
    const prev = last;
    onSave(m.en, { t: Date.now(), w: W, r: R, rpe: P });
    const dv = prev ? W * R - prev.w * prev.r : 0;
    setMsg(prev ? (dv > 0 ? `已儲存 · 訓練量較上次 +${dv} kg 👍` : dv < 0 ? `已儲存 · 訓練量較上次 ${dv} kg` : "已儲存 · 與上次相同，可嘗試加 1–2 下或小幅加重") : "已儲存 · 首次紀錄");
  };
  const inp = "w-full bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:border-emerald-400";
  return (
    <div className="rounded-xl bg-slate-900/70 border border-slate-700 p-3">
      <p className="text-xs font-semibold text-cyan-300 mb-1 flex items-center gap-1"><IconActivity size={13} />訓練紀錄</p>
      <p className="text-xs text-slate-400 mb-2">{last ? <>上次：{fmt(last.t)} · <b className="text-slate-200">{last.w}kg × {last.r}</b> · RPE {last.rpe}</> : "尚無紀錄，完成一組後記下來吧。"}</p>
      <div className="grid grid-cols-3 gap-2">
        <label className="text-[11px] text-slate-400">重量 (kg)<input type="number" inputMode="decimal" min="0" step="0.5" value={w} onChange={e => setW(e.target.value)} className={inp} /></label>
        <label className="text-[11px] text-slate-400">次數 (Reps)<input type="number" inputMode="numeric" min="1" value={r} onChange={e => setR(e.target.value)} className={inp} /></label>
        <label className="text-[11px] text-slate-400">RPE (1-10)<input type="number" inputMode="decimal" min="1" max="10" step="0.5" value={rpe} onChange={e => setRpe(e.target.value)} className={inp} /></label>
      </div>
      <button onClick={save} className="mt-2 w-full rounded-lg py-1.5 text-sm font-semibold bg-slate-700 hover:bg-emerald-500 hover:text-slate-900 transition-colors">儲存紀錄</button>
      {msg && <p className="text-xs text-emerald-300 mt-1.5">{msg}</p>}
    </div>
  );
}

function RestModal({ m, onClose }) {
  const [total, setTotal] = useState(90);
  const [left, setLeft] = useState(90);
  const [done, setDone] = useState(false);
  const [tip, setTip] = useState(0);
  const tips = [...m.tips, "用力時吐氣、回放時吸氣，保持核心收緊"];
  React.useEffect(() => { setLeft(total); setDone(false); }, [total]);
  React.useEffect(() => {
    if (done) return;
    const id = setInterval(() => setLeft(l => l - 1), 1000);
    return () => clearInterval(id);
  }, [total, done]);
  React.useEffect(() => { if (left <= 0 && !done) { setDone(true); beep(); } }, [left, done]);
  React.useEffect(() => { const id = setInterval(() => setTip(t => t + 1), 3500); return () => clearInterval(id); }, []);
  const L = Math.max(0, left), C = 2 * Math.PI * 54;
  return (
    <div className="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
      <div className="fadein w-full max-w-sm bg-slate-800 border border-cyan-400/50 rounded-3xl p-5 text-center" onClick={e => e.stopPropagation()}>
        <p className="text-xs text-cyan-400 tracking-widest">發力核心提示 · {m.zh}</p>
        <p key={tip} className="fadein min-h-[3.5rem] mt-2 text-lg font-bold text-emerald-300 flex items-center justify-center">{tips[tip % tips.length]}</p>
        <div className="relative w-44 h-44 mx-auto my-3">
          <svg viewBox="0 0 120 120" className="w-full h-full -rotate-90">
            <circle cx="60" cy="60" r="54" fill="none" stroke="#1e293b" strokeWidth="8" />
            <circle cx="60" cy="60" r="54" fill="none" stroke={done ? "#34d399" : "#22d3ee"} strokeWidth="8" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - L / total)} style={{ transition: "stroke-dashoffset 1s linear" }} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="text-4xl font-extrabold tabular-nums">{Math.floor(L / 60)}:{String(L % 60).padStart(2, "0")}</span>
            <span className="text-xs text-slate-400">{done ? "休息結束，下一組！" : "組間休息中"}</span>
          </div>
        </div>
        <div className="flex justify-center gap-2 mb-3">
          {[60, 90, 120].map(s => (
            <button key={s} onClick={() => { setTotal(s); setLeft(s); setDone(false); }}
              className={"px-4 py-1.5 rounded-full text-sm font-semibold border " + (total === s ? "bg-emerald-500 text-slate-900 border-emerald-400" : "border-slate-600 text-slate-300")}>{s}s</button>

          <button onClick={onClose} className="flex-1 rounded-xl py-2 text-sm font-semibold bg-cyan-400 text-slate-900">關閉</button>
        </div>
        <p className="text-[11px] text-slate-500 mt-2">時間到會發出提示音與震動（iPhone 僅有聲音，且需未開靜音）。</p>

          </div>
          <div className="flex gap-2 mt-4 overflow-x-auto pb-1">
            {GOALS.map(g => (
              <button key={g.id} onClick={() => chooseGoal(g.id)}
                className={"shrink-0 px-4 py-2 rounded-full text-sm font-semibold border transition-all " + (goal === g.id ? "bg-emerald-500 border-emerald-400 text-slate-900 shadow-lg shadow-emerald-500/20" : "border-slate-600 text-slate-300 hover:border-cyan-400 hover:text-cyan-300")}>
                {g.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 sm:px-8 py-6 grid lg:grid-cols-5 gap-6">
        <section className="lg:col-span-2 bg-slate-800/60 border border-slate-700 rounded-2xl p-4 sm:p-5 lg:sticky lg:top-4 self-start">
          <label className="block text-xs text-slate-400 mb-1">快速選擇肌群（手機友善）</label>
          <select value={active || ""} onChange={(e) => pick(e.target.value || null)}
            className="w-full mb-3 bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-400">
            <option value="">— 全部肌群 —</option>
            {["front", "back"].map(v => (
              <optgroup key={v} label={v === "front" ? "正面 Anterior" : "背面 Posterior"}>
                {Object.keys(MUSCLES).filter(k => MUSCLES[k].view === v).map(k => <option key={k} value={k}>{MUSCLES[k].zh} / {MUSCLES[k].en}</option>)}
              </optgroup>
            ))}
          </select>
          <div className="flex items-center justify-between mb-3">
            <div className="flex bg-slate-900 rounded-xl p-1">
              {[["front", "正面"], ["back", "背面"]].map(([v, l]) => (
                <button key={v} onClick={() => switchView(v)}
                  className={"px-4 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition-colors " + (view === v ? "bg-emerald-500 text-slate-900" : "text-slate-400 hover:text-slate-100")}>
                  <IconUser size={14} />{l}
                </button>
              ))}
            </div>
            <button onClick={reset} className="text-slate-400 hover:text-cyan-400 flex items-center gap-1 text-sm transition-colors"><IconReset size={15} />重置</button>
          </div>
          <div ref={wrap} className="relative" onMouseMove={onMove}>
            <BodyMap view={view} active={active} hints={hints} done={done} onSelect={pick} onHover={setHover} />
            {hover && (
              <div className="pointer-events-none absolute z-10 px-3 py-1.5 rounded-lg bg-slate-950/95 border border-cyan-400/60 text-sm shadow-lg whitespace-nowrap"
                style={{ left: Math.min(pos.x + 14, 150), top: pos.y + 14 }}>
                <span className="font-bold text-cyan-300">{MUSCLES[hover].zh}</span> <span className="text-slate-400">/ {MUSCLES[hover].en}</span>
              </div>
            )}
          </div>
          <div className="mt-3 rounded-xl bg-slate-900/70 border border-slate-700 p-3 text-xs">
            <p className="font-semibold text-cyan-300">本週肌群覆蓋 {done.size}/{Object.keys(MUSCLES).length}
              <span className="ml-2 inline-block w-2.5 h-2.5 rounded-full bg-cyan-400 align-middle" /> <span className="text-slate-400 font-normal">已訓練</span>
              <span className="ml-2 inline-block w-2.5 h-2.5 rounded-full bg-slate-600 align-middle" /> <span className="text-slate-400 font-normal">未訓練</span></p>
            <p className="text-slate-400 mt-1">{missing.length ? <>尚未練到：{missing.join("、")}</> : "本週所有肌群都練到了，太棒了！💪"}</p>
          </div>
        </section>

        <section className="lg:col-span-3">
          <div className="mb-4 p-4 rounded-2xl bg-slate-800/60 border border-slate-700">
            <p className="text-xs font-semibold text-cyan-300 mb-2">站在機器前？選外觀特徵，秒查器械</p>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="搜尋器械名稱 / 肌群，例如「蝴蝶機」、leg press"
              className="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400" />
            <div className="flex gap-2 mt-2 overflow-x-auto pb-1 items-center">
              <span className="text-xs text-slate-500 shrink-0">型態</span>
              {TYPES.map(([k, l]) => <Chip key={k} on={tf === k} onClick={() => setTf(tf === k ? "" : k)}>{l}</Chip>)}
            </div>
            <div className="flex gap-2 mt-1 overflow-x-auto pb-1 items-center">
              <span className="text-xs text-slate-500 shrink-0">姿勢</span>
              {POSES.map(([k, l]) => <Chip key={k} on={pf === k} onClick={() => setPf(pf === k ? "" : k)}>{l}</Chip>)}
              {qOn && <button onClick={clearFeat} className="shrink-0 text-xs text-slate-400 underline ml-2">清除</button>}
            </div>
          </div>

          <div className="mb-4 p-5 rounded-2xl bg-gradient-to-r from-emerald-500/10 to-cyan-400/10 border border-slate-700">
            <p className="text-xs uppercase tracking-widest text-cyan-400">目前篩選 · {G.label}{qOn ? " · 外觀/關鍵字" : active ? " · " + MUSCLES[active].zh : ""}</p>
            <h2 className="text-2xl sm:text-3xl font-extrabold mt-1">
              {qOn ? "快速查機結果" : active ? <>{MUSCLES[active].zh} <span className="text-emerald-400 text-lg sm:text-xl font-semibold">/ {MUSCLES[active].en}</span></> : G.label}
            </h2>
            <p className="text-slate-300 mt-2 text-sm sm:text-base"><span className="text-emerald-400 font-semibold">訓練目標：</span>{qOn ? "跨肌群比對外觀特徵，找到眼前這台機器。" : active ? MUSCLES[active].goal : G.desc}</p>
            <p className="text-xs text-slate-500 mt-2">共 {list.length} 款器械 · 訓練紀錄只存在這台裝置的瀏覽器中。</p>
          </div>
          {warn && <p className="text-amber-300 text-sm mb-3">⚠ 瀏覽器無法儲存紀錄（可能是無痕模式），關閉頁面後紀錄會消失。</p>}

          {list.length === 0 ? (
            <div className="text-center p-10 border border-dashed border-slate-600 rounded-2xl text-slate-400">
              沒有符合條件的器械。
              <div><button onClick={() => { clearFeat(); chooseGoal("all"); }} className="mt-3 text-emerald-400 underline">清除全部篩選</button></div>
            </div>
          ) : (
            <div key={goal + active + q + tf + pf} className="grid sm:grid-cols-2 gap-4">
              {list.map(m => <MachineCard key={m.en} m={m} logs={logs} onSave={onSave} onRest={setRest} />)}
            </div>
          )}
          <p className="text-xs text-slate-500 mt-6">⚠ 本工具僅供教育參考，不能取代專業教練或醫療建議；若有疼痛或舊傷，請先諮詢專業人員。</p>
        </section>
      </main>
      {rest && <RestModal m={rest} onClose={() => setRest(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
